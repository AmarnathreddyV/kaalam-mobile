name: KAALAM Drik source-page evidence verification

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/verify_drik_source_pages.py"
      - "backend/data/accuracy_reference.csv"
      - ".github/workflows/verify-drik-source-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaalam-drik-source-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify expected tokens in official Drik source pages
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and inspect reference pages
        id: verify
        continue-on-error: true
        run: python backend/scripts/verify_drik_source_pages.py

      - name: Upload source verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaalam-drik-source-verification-report
          path: drik-source-verification-report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail if any source row is unverified
        if: steps.verify.outcome == 'failure'
        run: |
          echo "One or more Drik Panchang pages could not be fetched or did not contain all expected tokens."
          exit 1
