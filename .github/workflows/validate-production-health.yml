name: KAALAM live production health smoke test

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/validate_production_health.py"
      - ".github/workflows/validate-production-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaalam-production-health
  cancel-in-progress: true

jobs:
  health:
    name: Check deployed health and shared cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check live production endpoints
        run: python backend/scripts/validate_production_health.py
        env:
          KAALAM_API_BASE: https://kaalam-mobile.onrender.com
