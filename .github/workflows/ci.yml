name: KAALAM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaalam-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Expo and TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Expo dependency and configuration diagnostics
        run: npx expo-doctor

  backend:
    name: FastAPI backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q backend/app backend/tests

      - name: Run backend unit tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v
